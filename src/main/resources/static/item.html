<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Item Details — Lost &amp; Found Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="content-wrapper">
    <div id="topbar-mount"></div>
    <div class="main-content">

      <div style="margin-bottom:16px">
        <button class="btn btn-outline btn-sm" onclick="history.back()">
          <i class="fas fa-arrow-left"></i> Back
        </button>
      </div>

      <div id="itemContent" style="display:grid;grid-template-columns:1fr 1fr;gap:24px;align-items:start">
        <div style="text-align:center;grid-column:1/-1;padding:40px"><span class="spinner"></span> Loading…</div>
      </div>

    </div>
  </div>
</div>

<!-- Claim Modal -->
<div class="modal fade" id="claimModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered modal-lg">
<div class="modal-content" style="border-radius:12px;border:none">
  <div class="modal-header" style="border-bottom:1px solid var(--border)">
    <h5 class="modal-title"><i class="fas fa-hand-holding me-2"></i>Claim This Item</h5>
    <button class="btn-close" data-bs-dismiss="modal"></button>
  </div>
  <div class="modal-body">
    <div class="alert alert-info" style="font-size:13px">
      <i class="fas fa-info-circle"></i>
      Your claim will be reviewed by the student who found the item or the campus desk. Only the rightful owner should claim.
    </div>
    <div id="claimMsg"></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input id="fullName" class="form-control" placeholder="As per ID proof">
      </div>
      <div class="form-group">
        <label class="form-label">Age *</label>
        <input id="age" type="number" class="form-control" placeholder="Your age">
      </div>
      <div class="form-group">
        <label class="form-label">Mobile Number *</label>
        <input id="claimMobile" class="form-control" placeholder="10-digit number">
      </div>
      <div class="form-group">
        <label class="form-label">ID Proof Type *</label>
        <select id="proofType" class="form-control">
          <option value="">Select proof type</option>
          <option>Aadhaar Card</option>
          <option>Driving License</option>
          <option>College ID</option>
          <option>Passport</option>
          <option>PAN Card</option>
          <option>Other</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">How do you identify this as yours? *</label>
      <textarea id="reason" class="form-control" rows="3"
        placeholder="Describe specific details only you would know — serial number, unique marks, what was inside, etc."></textarea>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
      <div class="form-group">
        <label class="form-label">Government ID Photo *</label>
        <input type="file" id="govProofImage" class="form-control" accept="image/*">
      </div>
      <div class="form-group">
        <label class="form-label">Product Proof (bill/photo) *</label>
        <input type="file" id="productProofImage" class="form-control" accept="image/*">
      </div>
    </div>
  </div>
  <div class="modal-footer" style="border-top:1px solid var(--border)">
    <button class="btn btn-outline" data-bs-dismiss="modal">Cancel</button>
    <button class="btn btn-warning" onclick="submitClaim()" id="claimSubmitBtn">
      <i class="fas fa-paper-plane"></i> Submit Claim
    </button>
  </div>
</div>
</div>
</div>

<script src="/js/app.js"></script>
<script>
const itemId = new URLSearchParams(window.location.search).get('id');

(async () => {
  await initPage({ activePage: 'search', pageTitle: 'Item Details', requireAuth: false });
  if (!itemId) { window.location = '/search.html'; return; }
  loadItem();
})();

async function loadItem() {
  try {
    const res = await fetch('/api/items/' + itemId);
    if (!res.ok) { window.location = '/search.html'; return; }
    const item = await res.json();
    renderItem(item);
  } catch {
    document.getElementById('itemContent').innerHTML =
      '<div style="grid-column:1/-1"><div class="alert alert-danger">Failed to load item</div></div>';
  }
}

function renderItem(item) {
  const canClaim = !item.lost && item.status === 'ACTIVE' && isLoggedIn();
  const isOwner  = item.reportedBy?.username === getUsername();

  document.getElementById('itemContent').innerHTML = `
  <!-- Image -->
  <div class="card" style="overflow:hidden">
    <div style="background:var(--body-bg);min-height:320px;display:flex;align-items:center;justify-content:center;border-radius:12px">
      ${item.photo
        ? `<img src="/api/items/photo/${item.id}" style="max-width:100%;max-height:400px;object-fit:contain">`
        : `<div style="text-align:center;color:var(--text-muted)">
            <i class="fas fa-${item.lost?'exclamation-circle':'hand-holding'}" style="font-size:80px;opacity:.2"></i>
            <p style="margin-top:12px">No image available</p>
           </div>`
      }
    </div>
  </div>

  <!-- Details -->
  <div>
    <div style="display:flex;gap:10px;align-items:center;margin-bottom:14px">
      ${typeBadge(item.lost)}
      ${statusBadge(item.status)}
    </div>
    <h2 style="font-size:24px;font-weight:700;margin-bottom:16px">${escHtml(item.title)}</h2>

    <div class="card" style="margin-bottom:16px">
      <div class="card-body" style="padding:16px">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;font-size:14px">
          <div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Category</div>
            <div style="font-weight:600;margin-top:2px">${escHtml(item.category||'—')}</div>
          </div>
          <div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Colour</div>
            <div style="font-weight:600;margin-top:2px">${escHtml(item.colour||'—')}</div>
          </div>
          <div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600">${item.lost?'Lost':'Found'} Location</div>
            <div style="font-weight:600;margin-top:2px"><i class="fas fa-map-marker-alt me-1" style="color:#dc2626"></i>${escHtml(item.location||'—')}</div>
          </div>
          <div>
            <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600">Date</div>
            <div style="font-weight:600;margin-top:2px"><i class="fas fa-calendar me-1" style="color:#2563eb"></i>${item.dateEvent||'—'}</div>
          </div>
        </div>

        ${item.description ? `
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border)">
          <div style="font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600;margin-bottom:6px">Description</div>
          <div style="font-size:14px;line-height:1.6">${escHtml(item.description)}</div>
        </div>` : ''}
      </div>
    </div>

    <!-- Claim Action -->
    ${item.status !== 'ACTIVE' ? `
      <div class="alert alert-info">
        <i class="fas fa-info-circle"></i>
        This item is no longer available for claiming (Status: ${item.status}).
      </div>
    ` : item.lost ? `
      <div class="alert alert-warning">
        <i class="fas fa-hourglass-half"></i>
        This is a lost item report. If you found this item, please
        <a href="/report-found.html" style="font-weight:600">submit a found report</a>.
      </div>
    ` : isOwner ? `
      <div class="alert alert-info">
        <i class="fas fa-info-circle"></i>
        This is your own found item report.
      </div>
    ` : canClaim ? `
      <button class="btn btn-warning" style="width:100%;padding:14px"
              data-bs-toggle="modal" data-bs-target="#claimModal">
        <i class="fas fa-hand-holding" style="font-size:18px"></i>
        <span style="font-size:16px;font-weight:700">Claim This Item</span>
      </button>
      <p style="font-size:12px;color:var(--text-muted);text-align:center;margin-top:8px">
        Only the rightful owner should claim. False claims may result in action.
      </p>
    ` : !isLoggedIn() ? `
      <a href="/login.html" class="btn btn-primary" style="width:100%;padding:14px">
        <i class="fas fa-sign-in-alt"></i> Login to Claim This Item
      </a>
    ` : ''}

  </div>`;
}

async function submitClaim() {
  const fullName       = document.getElementById('fullName').value.trim();
  const age            = document.getElementById('age').value;
  const mobile         = document.getElementById('claimMobile').value.trim();
  const proofType      = document.getElementById('proofType').value;
  const reason         = document.getElementById('reason').value.trim();
  const govProof       = document.getElementById('govProofImage').files[0];
  const productProof   = document.getElementById('productProofImage').files[0];
  const msgEl          = document.getElementById('claimMsg');

  if (!fullName || !age || !mobile || !proofType || !reason || !govProof || !productProof) {
    msgEl.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> All fields are required</div>';
    return;
  }

  const btn = document.getElementById('claimSubmitBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Submitting…';

  const fd = new FormData();
  fd.append('fullName', fullName);
  fd.append('age', age);
  fd.append('mobile', mobile);
  fd.append('govProofName', proofType);
  fd.append('reason', reason);
  fd.append('govProofImage', govProof);
  fd.append('productProofImage', productProof);

  try {
    const res = await apiFetch('/api/claims/' + itemId, { method: 'POST', body: fd });
    if (res.ok) {
      msgEl.innerHTML = '<div class="alert alert-success"><i class="fas fa-check-circle"></i> Claim submitted successfully! An administrator will review it.</div>';
      ['fullName','age','claimMobile','reason'].forEach(id => document.getElementById(id).value='');
      document.getElementById('proofType').value = '';
      document.getElementById('govProofImage').value = '';
      document.getElementById('productProofImage').value = '';
    } else {
      const t = await res.text();
      msgEl.innerHTML = `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${escHtml(t)||'Failed to submit claim'}</div>`;
    }
  } catch {
    msgEl.innerHTML = '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Server error. Please try again.</div>';
  }
  btn.disabled = false; btn.innerHTML = '<i class="fas fa-paper-plane"></i> Submit Claim';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
