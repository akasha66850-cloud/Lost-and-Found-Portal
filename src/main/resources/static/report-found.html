<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Found Item — Lost &amp; Found Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="content-wrapper">
    <div id="topbar-mount"></div>
    <div class="main-content">

      <div class="page-header">
        <h2><i class="fas fa-hand-holding me-2" style="color:#16a34a"></i>Report Found Item</h2>
      </div>

      <div style="max-width:700px">
        <div class="alert alert-info" style="margin-bottom:20px">
          <i class="fas fa-info-circle"></i>
          <span>Reporting a found item helps return it to its rightful owner. Do not share any identifying private information publicly.</span>
        </div>

        <div class="card">
          <div class="card-header">
            <span class="card-title">Found Item Details</span>
          </div>
          <div class="card-body">
            <div id="formMsg"></div>
            <form id="reportForm" enctype="multipart/form-data">
              <input type="hidden" name="lost" value="false">

              <div class="form-group">
                <label class="form-label">Item Name <span style="color:#dc2626">*</span></label>
                <input name="title" class="form-control" placeholder="e.g. iPhone 14 Pro" required>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                <div class="form-group">
                  <label class="form-label">Category <span style="color:#dc2626">*</span></label>
                  <select name="category" class="form-control" required>
                    <option value="">Select category</option>
                    <option>Electronics</option>
                    <option>Bag / Wallet</option>
                    <option>Books / Documents</option>
                    <option>Clothing</option>
                    <option>Jewellery</option>
                    <option>Keys</option>
                    <option>Sports Equipment</option>
                    <option>Stationery</option>
                    <option>Vehicle</option>
                    <option>Other</option>
                  </select>
                </div>
                <div class="form-group">
                  <label class="form-label">Colour</label>
                  <input name="colour" class="form-control" placeholder="e.g. Black, Silver">
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Description</label>
                <textarea name="description" class="form-control" rows="3"
                  placeholder="Describe the item without revealing highly specific identifying details that only the owner would know..."></textarea>
              </div>

              <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px">
                <div class="form-group">
                  <label class="form-label">Found Location <span style="color:#dc2626">*</span></label>
                  <input name="location" class="form-control" placeholder="e.g. Cafeteria, Block A" required>
                </div>
                <div class="form-group">
                  <label class="form-label">Date Found <span style="color:#dc2626">*</span></label>
                  <input name="dateEvent" type="date" class="form-control" required>
                </div>
              </div>

              <div class="form-group">
                <label class="form-label">Your Contact Number</label>
                <input name="mobile" class="form-control" placeholder="e.g. 9876543210">
              </div>

              <div class="form-group">
                <label class="form-label">Item Photo <span style="color:#dc2626">*</span></label>
                <input type="file" name="photo" class="form-control" accept="image/*" id="photoInput" required>
                <small style="color:var(--text-muted);font-size:12px">A photo helps the owner identify their item. Max 20MB.</small>
                <div id="photoPreview" style="margin-top:10px;display:none">
                  <img id="previewImg" style="max-height:160px;border-radius:8px;border:1px solid var(--border)">
                </div>
              </div>

              <div style="display:flex;gap:12px;margin-top:8px">
                <button type="submit" class="btn btn-success" id="submitBtn">
                  <i class="fas fa-hand-holding"></i> Submit Found Report
                </button>
                <button type="reset" class="btn btn-outline" onclick="clearPreview()">Clear</button>
              </div>
            </form>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
initPage({ activePage: 'report-found', pageTitle: 'Report Found Item', requireAuth: true });

document.querySelector('[name=dateEvent]').valueAsDate = new Date();

document.getElementById('photoInput').addEventListener('change', function() {
  const file = this.files[0];
  if (file) {
    const reader = new FileReader();
    reader.onload = e => {
      document.getElementById('previewImg').src = e.target.result;
      document.getElementById('photoPreview').style.display = 'block';
    };
    reader.readAsDataURL(file);
  }
});

function clearPreview() {
  document.getElementById('photoPreview').style.display = 'none';
}

document.getElementById('reportForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Submitting…';
  document.getElementById('formMsg').innerHTML = '';

  const fd = new FormData(e.target);

  try {
    const res = await apiFetch('/api/items', { method: 'POST', body: fd });

    if (res.ok) {
      const item = await res.json();
      document.getElementById('formMsg').innerHTML =
        `<div class="alert alert-success">
          <i class="fas fa-check-circle"></i>
          Found item report submitted successfully! Report ID: #${item.id}.
          The system will check for matching lost reports and notify you if a match is found.
        </div>`;
      e.target.reset();
      clearPreview();
      document.querySelector('[name=dateEvent]').valueAsDate = new Date();
    } else {
      const text = await res.text();
      document.getElementById('formMsg').innerHTML =
        `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> ${text || 'Failed to submit'}</div>`;
    }
  } catch {
    document.getElementById('formMsg').innerHTML =
      `<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Server error. Please try again.</div>`;
  }

  btn.disabled = false;
  btn.innerHTML = '<i class="fas fa-hand-holding"></i> Submit Found Report';
  document.getElementById('formMsg').scrollIntoView({ behavior: 'smooth' });
});
</script>
</body>
</html>
