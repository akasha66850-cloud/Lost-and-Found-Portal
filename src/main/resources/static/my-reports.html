<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Reports — Lost &amp; Found Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="content-wrapper">
    <div id="topbar-mount"></div>
    <div class="main-content">

      <div class="page-header">
        <h2><i class="fas fa-file-alt me-2" style="color:#7c3aed"></i>My Reports</h2>
        <div style="display:flex;gap:10px">
          <a href="/report-lost.html" class="btn btn-danger btn-sm"><i class="fas fa-plus"></i> Report Lost</a>
          <a href="/report-found.html" class="btn btn-success btn-sm"><i class="fas fa-plus"></i> Report Found</a>
        </div>
      </div>

      <!-- Filter tabs -->
      <div style="display:flex;gap:8px;margin-bottom:20px">
        <button class="btn btn-primary btn-sm" onclick="filterItems('all',this)" id="btnAll">All</button>
        <button class="btn btn-outline btn-sm" onclick="filterItems('lost',this)" id="btnLost">Lost</button>
        <button class="btn btn-outline btn-sm" onclick="filterItems('found',this)" id="btnFound">Found</button>
      </div>

      <div class="table-responsive">
        <table class="data-table">
          <thead>
            <tr>
              <th>#</th>
              <th>Item</th>
              <th>Category</th>
              <th>Type</th>
              <th>Location</th>
              <th>Date</th>
              <th>Status</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="reportsBody">
            <tr><td colspan="8" style="text-align:center;padding:24px"><span class="spinner"></span> Loading…</td></tr>
          </tbody>
        </table>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let allItems = [];

(async () => {
  await initPage({ activePage: 'my-reports', pageTitle: 'My Reports', requireAuth: true });
  loadMyReports();
})();

async function loadMyReports() {
  try {
    const res = await apiFetch('/api/items/my-reports');
    if (res.status === 401) { window.location = '/login.html'; return; }
    allItems = await res.json();
    renderItems(allItems);
  } catch {
    document.getElementById('reportsBody').innerHTML =
      '<tr><td colspan="8"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load reports</p></div></td></tr>';
  }
}

function filterItems(type, btn) {
  document.querySelectorAll('.page-header ~ div .btn').forEach(b => {
    b.className = 'btn btn-outline btn-sm';
  });
  btn.className = 'btn btn-primary btn-sm';

  if (type === 'lost')  renderItems(allItems.filter(i => i.lost));
  else if (type === 'found') renderItems(allItems.filter(i => !i.lost));
  else renderItems(allItems);
}

function renderItems(items) {
  const tbody = document.getElementById('reportsBody');
  if (!items.length) {
    tbody.innerHTML = `<tr><td colspan="8">
      <div class="empty-state">
        <i class="fas fa-file-alt"></i>
        <h4>No reports yet</h4>
        <p>You haven't submitted any reports yet.</p>
        <div style="display:flex;gap:10px;justify-content:center;margin-top:16px">
          <a href="/report-lost.html" class="btn btn-danger btn-sm">Report Lost Item</a>
          <a href="/report-found.html" class="btn btn-success btn-sm">Report Found Item</a>
        </div>
      </div>
    </td></tr>`;
    return;
  }

  tbody.innerHTML = items.map(i => `
  <tr>
    <td style="color:var(--text-muted);font-size:12px">#${i.id}</td>
    <td>
      <div style="display:flex;align-items:center;gap:10px">
        <div class="item-thumb-placeholder">
          <i class="fas fa-${i.lost?'exclamation-circle':'hand-holding'}" style="color:${i.lost?'#dc2626':'#16a34a'}"></i>
        </div>
        <div>
          <div style="font-weight:600">${escHtml(i.title)}</div>
          ${i.colour ? `<div style="font-size:11px;color:var(--text-muted)">${escHtml(i.colour)}</div>` : ''}
        </div>
      </div>
    </td>
    <td>${escHtml(i.category||'—')}</td>
    <td>${typeBadge(i.lost)}</td>
    <td style="font-size:12px">${escHtml(i.location||'—')}</td>
    <td style="font-size:12px;color:var(--text-muted)">${i.dateEvent||'—'}</td>
    <td>${statusBadge(i.status)}</td>
    <td><a href="/item.html?id=${i.id}" class="btn btn-outline btn-sm">View</a></td>
  </tr>`).join('');
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
