<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search Items — Lost &amp; Found Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="content-wrapper">
    <div id="topbar-mount"></div>
    <div class="main-content">

      <div class="page-header">
        <h2><i class="fas fa-search me-2" style="color:#2563eb"></i>Search Items</h2>
      </div>

      <!-- Search Filters -->
      <div class="card" style="margin-bottom:24px">
        <div class="card-body">
          <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;align-items:end">
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Keyword</label>
              <input id="fQ" class="form-control" placeholder="Search by name…">
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Category</label>
              <select id="fCat" class="form-control">
                <option value="">All Categories</option>
                <option>Electronics</option>
                <option>Bag / Wallet</option>
                <option>Books / Documents</option>
                <option>Clothing</option>
                <option>Jewellery</option>
                <option>Keys</option>
                <option>Sports Equipment</option>
                <option>Stationery</option>
                <option>Vehicle</option>
                <option>Other</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Type</label>
              <select id="fType" class="form-control">
                <option value="">Lost &amp; Found</option>
                <option value="true">Lost Only</option>
                <option value="false">Found Only</option>
              </select>
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Location</label>
              <input id="fLoc" class="form-control" placeholder="e.g. Library">
            </div>
            <div class="form-group" style="margin-bottom:0">
              <label class="form-label">Status</label>
              <select id="fStatus" class="form-control">
                <option value="">All Statuses</option>
                <option value="ACTIVE">Active</option>
                <option value="RETURNED">Returned</option>
                <option value="RESOLVED">Resolved</option>
              </select>
            </div>
            <div style="display:flex;gap:8px">
              <button class="btn btn-primary" onclick="doSearch()"><i class="fas fa-search"></i> Search</button>
              <button class="btn btn-outline" onclick="clearFilters()">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Results -->
      <div id="resultsInfo" style="font-size:13px;color:var(--text-muted);margin-bottom:12px"></div>

      <div id="resultsGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:20px">
        <div style="grid-column:1/-1;text-align:center;padding:40px">
          <span class="spinner"></span> Loading…
        </div>
      </div>

      <div id="loadMore" style="text-align:center;margin-top:24px;display:none">
        <button class="btn btn-outline" onclick="loadNextPage()"><i class="fas fa-chevron-down"></i> Load More</button>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
let currentPage = 0;
let currentItems = [];

(async () => {
  await initPage({ activePage: 'search', pageTitle: 'Search Items', requireAuth: false });
  doSearch();
})();

// Search on Enter key
['fQ','fLoc'].forEach(id => {
  document.getElementById(id).addEventListener('keydown', e => { if(e.key==='Enter') doSearch(); });
});

function clearFilters() {
  ['fQ','fLoc'].forEach(id => document.getElementById(id).value='');
  ['fCat','fType','fStatus'].forEach(id => document.getElementById(id).value='');
  doSearch();
}

async function doSearch() {
  currentPage = 0;
  currentItems = [];
  document.getElementById('resultsGrid').innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px"><span class="spinner"></span></div>';
  document.getElementById('loadMore').style.display = 'none';
  await loadNextPage();
}

async function loadNextPage() {
  const q      = document.getElementById('fQ').value.trim();
  const cat    = document.getElementById('fCat').value;
  const type   = document.getElementById('fType').value;
  const loc    = document.getElementById('fLoc').value.trim();
  const status = document.getElementById('fStatus').value;

  const params = new URLSearchParams({ page: currentPage, size: 12 });
  if (q)      params.set('q', q);
  if (cat)    params.set('category', cat);
  if (type)   params.set('isLost', type);
  if (loc)    params.set('location', loc);
  if (status) params.set('status', status);

  try {
    const res = await fetch('/api/items?' + params);
    const items = await res.json();

    currentItems = currentPage === 0 ? items : [...currentItems, ...items];
    currentPage++;

    renderResults(currentItems, items.length);
  } catch {
    document.getElementById('resultsGrid').innerHTML =
      '<div style="grid-column:1/-1"><div class="empty-state"><i class="fas fa-exclamation-triangle"></i><p>Failed to load items</p></div></div>';
  }
}

function renderResults(items, newCount) {
  document.getElementById('resultsInfo').textContent =
    items.length ? `Showing ${items.length} result${items.length!==1?'s':''}` : '';

  if (!items.length) {
    document.getElementById('resultsGrid').innerHTML = `
      <div style="grid-column:1/-1">
        <div class="empty-state">
          <i class="fas fa-search"></i>
          <h4>No items found</h4>
          <p>No lost or found items match your search. Try different keywords or clear the filters.</p>
        </div>
      </div>`;
    document.getElementById('loadMore').style.display = 'none';
    return;
  }

  document.getElementById('resultsGrid').innerHTML = items.map(i => `
  <div class="card" style="transition:.2s;cursor:pointer" onclick="window.location='/item.html?id=${i.id}'" onmouseenter="this.style.transform='translateY(-4px)'" onmouseleave="this.style.transform=''">
    <div style="background:var(--body-bg);height:160px;display:grid;place-items:center;border-radius:12px 12px 0 0;overflow:hidden">
      <i class="fas fa-${i.lost?'exclamation-circle':'hand-holding'}" style="font-size:48px;color:${i.lost?'rgba(220,38,38,.3)':'rgba(22,163,74,.3)'}"></i>
    </div>
    <div style="padding:16px">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
        ${typeBadge(i.lost)}
        ${statusBadge(i.status)}
      </div>
      <h4 style="font-size:15px;font-weight:700;margin-bottom:6px">${escHtml(i.title)}</h4>
      <div style="font-size:12px;color:var(--text-muted);margin-bottom:8px">
        ${i.category ? `<span><i class="fas fa-tag me-1"></i>${escHtml(i.category)}</span>` : ''}
        ${i.colour   ? `<span style="margin-left:8px"><i class="fas fa-palette me-1"></i>${escHtml(i.colour)}</span>` : ''}
      </div>
      ${i.location ? `<div style="font-size:12px;color:var(--text-muted)"><i class="fas fa-map-marker-alt me-1"></i>${escHtml(i.location)}</div>` : ''}
      <div style="font-size:12px;color:var(--text-muted);margin-top:4px"><i class="fas fa-calendar me-1"></i>${i.dateEvent||'—'}</div>
      <button class="btn btn-outline btn-sm" style="width:100%;margin-top:12px" onclick="event.stopPropagation();window.location='/item.html?id=${i.id}'">
        <i class="fas fa-eye"></i> View Details
      </button>
    </div>
  </div>`).join('');

  document.getElementById('loadMore').style.display = newCount === 12 ? 'block' : 'none';
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
