<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Claims — Lost &amp; Found Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<link rel="stylesheet" href="/css/dashboard.css">
</head>
<body>
<div class="app-layout">
  <div id="sidebar-mount"></div>
  <div class="content-wrapper">
    <div id="topbar-mount"></div>
    <div class="main-content">

      <div class="page-header">
        <h2><i class="fas fa-list-check me-2" style="color:#2563eb"></i>My Claims</h2>
      </div>

      <div id="claimsContainer">
        <div style="text-align:center;padding:40px"><span class="spinner"></span> Loading…</div>
      </div>

    </div>
  </div>
</div>

<script src="/js/app.js"></script>
<script>
(async () => {
  await initPage({ activePage: 'my-claims', pageTitle: 'My Claims', requireAuth: true });
  loadClaims();
})();

async function loadClaims() {
  try {
    const res = await apiFetch('/api/claims/my');
    if (res.status === 401) { window.location = '/login.html'; return; }
    const claims = await res.json();
    renderClaims(claims);
  } catch {
    document.getElementById('claimsContainer').innerHTML =
      '<div class="alert alert-danger"><i class="fas fa-exclamation-circle"></i> Failed to load claims</div>';
  }
}

function renderClaims(claims) {
  const el = document.getElementById('claimsContainer');
  if (!claims.length) {
    el.innerHTML = `<div class="card"><div class="card-body">
      <div class="empty-state">
        <i class="fas fa-list-check"></i>
        <h4>No claims yet</h4>
        <p>When you claim a found item, it will appear here.</p>
        <a href="/search.html" class="btn btn-primary" style="margin-top:16px">Browse Found Items</a>
      </div>
    </div></div>`;
    return;
  }

  const statusInfo = {
    'PENDING_VERIFICATION':       { icon: 'hourglass-half', msg: 'Your claim is under admin review.' },
    'APPROVED_AWAITING_HANDOVER': { icon: 'check-circle',   msg: 'Approved! Please visit the Lost & Found desk to collect your item.' },
    'REJECTED':                   { icon: 'times-circle',   msg: 'Your claim was not approved. See review notes below.' },
    'COMPLETED':                  { icon: 'check-double',   msg: 'Item has been returned to you. Thank you!' },
  };

  el.innerHTML = claims.map(c => {
    const info = statusInfo[c.status] || { icon: 'info-circle', msg: '' };
    return `
    <div class="card" style="margin-bottom:20px">
      <div class="card-header">
        <div>
          <span class="card-title">${escHtml(c.itemPost?.title || 'Item')}</span>
          <span style="margin-left:10px">${statusBadge(c.status)}</span>
        </div>
        <small style="color:var(--text-muted)">Claim #${c.id} · ${c.createdAt ? c.createdAt.substring(0,10) : ''}</small>
      </div>
      <div class="card-body">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
          <div>
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em">Item Details</div>
            <div style="margin-top:8px;font-size:14px">
              <div><b>Category:</b> ${escHtml(c.itemPost?.category||'—')}</div>
              <div><b>Location:</b> ${escHtml(c.itemPost?.location||'—')}</div>
              <div><b>Date:</b> ${c.itemPost?.dateEvent||'—'}</div>
            </div>
          </div>
          <div>
            <div style="font-size:12px;color:var(--text-muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em">Your Claim</div>
            <div style="margin-top:8px;font-size:14px">
              <div><b>Proof Type:</b> ${escHtml(c.proofType||'—')}</div>
              <div><b>Reason:</b> ${escHtml(c.reason||'—')}</div>
            </div>
          </div>
        </div>

        <div class="alert alert-${c.status==='REJECTED'?'danger':c.status==='COMPLETED'?'success':'info'}" style="margin-bottom:${c.reviewNotes?'12px':'0'}">
          <i class="fas fa-${info.icon}"></i> ${info.msg}
        </div>

        ${c.reviewNotes ? `
        <div style="background:var(--body-bg);border-radius:8px;padding:12px;font-size:13px">
          <b><i class="fas fa-comment-alt me-1"></i>Admin Notes:</b> ${escHtml(c.reviewNotes)}
        </div>` : ''}

        <div style="margin-top:12px">
          <a href="/item.html?id=${c.itemPost?.id}" class="btn btn-outline btn-sm">View Item</a>
          ${c.status==='APPROVED_AWAITING_HANDOVER' ? `
          <span style="margin-left:12px;font-size:13px;color:#16a34a;font-weight:600">
            <i class="fas fa-info-circle"></i> Please bring your ID and visit the Lost & Found desk to collect your item.
          </span>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function escHtml(s) {
  return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
</script>
</body>
</html>
